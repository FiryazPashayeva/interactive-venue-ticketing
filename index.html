<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Pink Palace - Interactive Ticketing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <main class="venue-section">
        <header class="main-header">
            <h1>Grand Pink Palace</h1>
            <p>Theatre hall with three price zones. Select a seat to see its details.</p>
        </header>

        <div class="controls" role="toolbar" aria-label="Map navigation">
            <button id="zoom-in" type="button" aria-label="Zoom in">Zoom +</button>
            <button id="zoom-out" type="button" aria-label="Zoom out">Zoom -</button>
            <button id="move-up" type="button" aria-label="Move up">Up</button>
            <button id="move-down" type="button" aria-label="Move down">Down</button>
            <button id="move-left" type="button" aria-label="Move left">Left</button>
            <button id="move-right" type="button" aria-label="Move right">Right</button>
            <button id="reset-view" type="button" class="reset" aria-label="Reset and center view">Reset view</button>
        </div>

        <div class="map-viewport" id="map-viewport">
            <div class="venue-map" id="venue-map">
                <div class="stage">STAGE</div>
                <!-- Zones, rows and seats are generated by app.js -->
            </div>
        </div>

        <ul class="legend">
            <li><span class="dot"></span>Available</li>
            <li><span class="dot inspected"></span>Selected</li>
            <li><span class="dot in-cart"></span>In cart</li>
            <li><span class="dot unavailable"></span>Taken</li>
        </ul>
    </main>

    <aside class="sidebar">
        <section class="card">
            <h2>Seat details</h2>
            <div id="seat-details" class="details-box" aria-live="polite"></div>
            <button id="add-to-cart-btn" type="button" class="primary-btn" disabled>ADD TO CART</button>
        </section>

        <section class="card">
            <h2>Your cart <span id="cart-count" class="badge">0</span></h2>
            <ul id="cart-items" class="cart-list"></ul>
            <div class="cart-summary">
                <span>Total</span>
                <strong class="total"><span id="total-price">0.00</span> AZN</strong>
            </div>
        </section>
    </aside>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
